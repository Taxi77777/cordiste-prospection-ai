name: Test email

on:
  workflow_dispatch:
    inputs:
      to:
        description: Destinataire du test
        required: true
        default: rachidleg77@gmail.com

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Envoyer un email de test
        env:
          SMTP_HOST: mail.cordiste-ile-de-france.fr
          SMTP_HOST_BACKUP: mail01.lwspanel.com
          SMTP_USER: contact@cordiste-ile-de-france.fr
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          TO: ${{ github.event.inputs.to }}
        run: |
          python - <<'PY'
          import os, smtplib, ssl
          from email.mime.text import MIMEText
          from email.utils import formataddr
          user=os.environ['SMTP_USER']; pwd=os.environ['SMTP_PASSWORD']; to=os.environ['TO']
          print("user=",user," pwd_len=",len(pwd))
          def build():
              m=MIMEText("Test Cordiste via GitHub.","plain","utf-8")
              m['Subject']="Test - Cordiste Prospection AI"
              m['From']=formataddr(("Cordiste Ile-de-France",user)); m['To']=to
              return m
          ctx=ssl.create_default_context()
          ok=False
          for host in [os.environ['SMTP_HOST'], os.environ['SMTP_HOST_BACKUP']]:
              try:
                  with smtplib.SMTP_SSL(host,465,context=ctx,timeout=25) as s:
                      s.login(user,pwd); s.send_message(build())
                  print("OK 465 SSL via",host); ok=True; break
              except Exception as e:
                  print("FAIL 465",host,repr(e))
              try:
                  with smtplib.SMTP(host,587,timeout=25) as s:
                      s.ehlo(); s.starttls(context=ctx); s.ehlo(); s.login(user,pwd); s.send_message(build())
                  print("OK 587 STARTTLS via",host); ok=True; break
              except Exception as e:
                  print("FAIL 587",host,repr(e))
          if not ok:
              raise SystemExit("Tous les essais ont echoue")
          PY
